[project]
name = "jarvis"
version = "0.3.0"
description = "Personal multi-agent assistant: supervisor + specialists + confirm gates + a node map you can drive with your eyes and hands"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The local brain. Not needed to run the map, the bridge, or the tests.
local = [
    "langchain-ollama>=0.3",
    "duckduckgo-search>=7.0",
]
cloud = [
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
]
# The websocket bridge that the HUD talks to.
bridge = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]
connectors = [
    "langchain-mcp-adapters>=0.1",
    "duckdb>=1.0",
]
voice = [
    "openwakeword>=0.6",
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",   # a blocked websocket read must fail, not hang CI
    "fastapi>=0.110",
    "websockets>=12.0",      # tests/live_check.py drives a real socket
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["prompts/*.md", "graph/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Bridge tests wait on a websocket message. When a regression means that
# message never arrives, the read blocks forever: the suite hangs instead of
# going red, which is the one failure mode CI cannot report. Cap it.
timeout = 30
