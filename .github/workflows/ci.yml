name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first. Cancel the older run instead of paying
# for a verdict on a commit nobody is waiting for any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bridge]"

      - name: Lint the roster
        # Refuses a map that contradicts itself: one supervisor with a
        # checkpointer, no specialist with one, no duplicate ids, one holder
        # for every send key, a real boolean gate on every write, no tool or
        # door above its owner's ceiling, a cap on every door, and no gesture
        # that authorizes.
        run: python -m jarvis.graph.build_graph --check

      - name: Rebuild the map and fail if it is not committed
        run: |
          python -m jarvis.graph.build_graph
          if ! git diff --quiet -- dashboard/graph.json hud/graph.json \
               dashboard/index.html hud/index.html; then
            {
              echo "### The committed map is stale"
              echo "\`python -m jarvis.graph.build_graph\` changed these files."
              echo "Run it locally and commit the result."
              echo '```diff'
              git diff --stat -- dashboard/graph.json hud/graph.json \
                dashboard/index.html hud/index.html
              git diff -- dashboard/graph.json hud/graph.json | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Audit the doors
        run: python -m jarvis.tools.connectors

      - name: Tests
        run: pytest -q

      - name: Live bridge check over a real socket
        # Proves the real transport path, not just the in-process ASGI client:
        # gate raised, voice surface refused, wrong code refused, replay is a
        # no-op, correct code approves, halt rejects.
        run: python tests/live_check.py

      - name: Say what broke, where it can be read
        # A failed step reports only "exit code N" in the annotation, and the
        # raw logs need an authenticated token to fetch. The step summary is
        # readable from the check-run API, so put the evidence there.
        if: failure()
        run: |
          {
            echo "## test job failed"
            echo '```'
            echo "python:   $(python -V 2>&1)"
            echo "platform: $(uname -sr)"
            echo "pytest:   $(python -m pytest --version 2>&1 | head -1)"
            echo '```'
            echo "### Working tree after the run"
            echo '```'
            git status --porcelain || true
            echo '```'
            echo "### Installed packages"
            echo '```'
            pip freeze 2>/dev/null | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  surfaces:
    # The HUD and dashboard are the part a test file cannot fully vouch for.
    # Load them in a real browser, fail on any console error, and prove the
    # graph drew pixels and the gate strip cannot be approved without the code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Serve the repo
        run: |
          python -m http.server 8099 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8099/ >/dev/null && break; sleep 0.5; done

      - name: Browser smoke test
        run: python tests/browser_check.py http://127.0.0.1:8099 /tmp/shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-screenshots
          path: /tmp/shots
