name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bridge]"

      - name: Lint the roster
        # Refuses a map that contradicts itself: one supervisor with a
        # checkpointer, no specialist with one, one owner per tool, a gate on
        # every write, no tool above its owner's ceiling, a cap on every door.
        run: python -m jarvis.graph.build_graph --check

      - name: Rebuild the map and fail if it is not committed
        run: |
          python -m jarvis.graph.build_graph
          git diff --exit-code -- dashboard/graph.json hud/graph.json \
            dashboard/index.html hud/index.html

      - name: Audit the doors
        run: python -m jarvis.tools.connectors

      - name: Tests
        run: pytest -q
